    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4
        with:
          path: driver

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3 git

      - name: Clone kernel source (shallow)
        run: |
          git clone --depth=1 --branch ${{ matrix.branch }} \
            https://android.googlesource.com/kernel/common kernel
        working-directory: ${{ runner.temp }}

      - name: Apply Android 13 kprobe fixes
        if: matrix.android_ver == '13'
        run: |
          cd ${{ runner.temp }}/kernel
          for symbol in register_kprobe unregister_kprobe; do
            grep -q "$symbol" common/android/abi_gki_aarch64 || \
            echo "$symbol" >> common/android/abi_gki_aarch64
          done
          sed -i '/EXPORT_SYMBOL(unregister_kprobe);/a EXPORT_SYMBOL(register_kprobe);' kernel/kprobes.c

      - name: Increase stack frame warning limit
        run: |
          cd ${{ runner.temp }}/kernel
          find . -type f -name "Makefile*" -exec sed -i 's/-Wframe-larger-than=[0-9]*/-Wframe-larger-than=4096/g' {} +

      - name: Prepare kernel config and modules
        run: |
          cd ${{ runner.temp }}/kernel
          make ARCH=arm64 gki_defconfig
          echo "CONFIG_LOCALVERSION=\"${{ matrix.localversion }}\"" >> .config
          make ARCH=arm64 olddefconfig
          make ARCH=arm64 modules_prepare -j$(nproc)
        env:
          CROSS_COMPILE: aarch64-linux-gnu-

      - name: Build driver module
        run: |
          cp -r ${{ github.workspace }}/driver/code/*.c ${{ github.workspace }}/driver/code/*.h ${{ github.workspace }}/driver/code/Makefile /tmp/driver-src/
          mkdir -p /tmp/driver-src
          cp ${{ github.workspace }}/driver/code/* /tmp/driver-src/
          cd ${{ runner.temp }}/kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=/tmp/driver-src modules -j$(nproc)

      - name: Collect and rename .ko
        run: |
          mkdir -p artifacts
          cp /tmp/driver-src/${{ github.event.inputs.driver_name }} artifacts/${{ matrix.label }}.ko
          7z a -tzip artifacts-${{ matrix.label }}.zip artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: artifacts-${{ matrix.label }}.zip
