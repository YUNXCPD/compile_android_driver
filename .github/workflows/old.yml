name: Android Kernel Driver Builder (Full Series)

# 一次编译 5.x ~ 6.x 全系 GKI 驱动（矩阵并行）。
# 系列写法会自动展开该系列的全部主流分支：
#   5.4  -> android12-5.4
#   5.10 -> android12-5.10 + android13-5.10
#   5.15 -> android13-5.15 + android14-5.15
#   6.1  -> android14-6.1      6.6  -> android15-6.6
#   6.12 -> android16-6.12     6.18 -> android17-6.18
# targets 用法示例：
#   6.12-2025-08              -> 只编 6.12，源码固定到 2025-08 发布线（= 内核 6.12.38）
#   5.10,5.15,6.1,6.6,6.12    -> 多分支一次并行编译（自动展开）
#   all                       -> 全量 9 分支：12-5.4 / 12-5.10 / 13-5.10 / 13-5.15 / 14-5.15 / 14-6.1 / 15-6.6 / 16-6.12 / 17-6.18
#   android14-5.15            -> 只取其中一支（也支持 14-5.15 简写）
#   android14-5.15-2025-09    -> 单分支 + 固定发布线
#   6.12-*（或 6.12-all）      -> 该系列全部发布月份（小版本全覆盖：23/30/38/58/69/81/92…，一月一 job）
# 固定发布线 = kernel/manifest 月度分支（全项目快照）：
#   例 6.12-2025-08 -> repo init -b common-android16-6.12-2025-08 （内核 6.12.38）
#   若月度分支不存在，自动回退：主干分支 + kernel/common 的 respin 标签（..._rN）。
#   不写月份 = 跟随各分支最新（内核小版本会随时间上涨）。
# 注：android11-5.4（GKI1 老线）未纳入自动展开，如需可显式写 android11-5.4。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '编译目标：系列自动展开子分支；6.12-* =该系列全部发布月份（小版本全覆盖）；单支写 android14-5.15；可带发布线如 6.12-2025-08；all=全量 9 分支'
        required: true
        default: '6.12-2025-08'
      target_arch:
        description: '目标架构'
        required: true
        default: 'aarch64'
      driver_name:
        description: '驱动模块名（如 yunwu.ko）；auto=从 Makefile 自动识别'
        required: false
        default: 'auto'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Parse targets
        id: parse
        env:
          TARGETS: ${{ github.event.inputs.targets }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          # 内核系列 -> 该系列全部主流分支（token 会自动展开）
          SERIES = {
              "5.4":  ["android12-5.4"],
              "5.10": ["android12-5.10", "android13-5.10"],
              "5.15": ["android13-5.15", "android14-5.15"],
              "6.1":  ["android14-6.1"],
              "6.6":  ["android15-6.6"],
              "6.12": ["android16-6.12"],
              "6.18": ["android17-6.18"],
          }
          ALL = [b for v in SERIES.values() for b in v]

          raw = os.environ.get("TARGETS", "").strip()
          toks = [t.strip() for t in re.split(r"[,\s]+", raw) if t.strip()]
          if len(toks) == 1 and toks[0].lower() == "all":
              toks = list(ALL)

          # 先取 kernel/manifest 分支列表（用于月份通配展开 + 分支校验）
          heads = None
          try:
              r = subprocess.run(
                  ["git", "ls-remote", "--heads",
                   "https://android.googlesource.com/kernel/manifest"],
                  capture_output=True, text=True, timeout=180)
              if r.returncode == 0:
                  heads = set()
                  for line in r.stdout.splitlines():
                      if "\t" in line:
                          ref = line.split("\t", 1)[1].strip()
                          if ref.startswith("refs/heads/"):
                              heads.add(ref[len("refs/heads/"):])
          except Exception:
              heads = None

          def months_for(b):
              pref = "common-" + b + "-"
              out = []
              if heads:
                  for h in heads:
                      if h.startswith(pref):
                          m = h[len(pref):]
                          if re.fullmatch(r"\d{4}-\d{2}", m):
                              out.append(m)
              return sorted(out)

          entries = []
          for tok in toks:
              if not re.fullmatch(r"[A-Za-z0-9.\-*]+", tok):
                  print("::error::非法字符: " + tok)
                  sys.exit(1)
              m = re.fullmatch(r"^(?:(?:android)?(\d+)-)?(\d+\.\d+)(?:-(\d{4}-\d{2}|\*|all))?$", tok)
              if not m:
                  print("::error::无法识别目标: " + tok)
                  sys.exit(1)
              a_fixed, kver, month = m.group(1), m.group(2), m.group(3) or ""
              if a_fixed:
                  branches = ["android" + a_fixed + "-" + kver]
              elif kver in SERIES:
                  branches = list(SERIES[kver])
              else:
                  print("::error::未知内核系列: " + kver + "（支持 " + ", ".join(SERIES) + "）")
                  sys.exit(1)
              if month in ("*", "all"):
                  # 通配：展开该系列全部发布月份（=全部内核小版本）
                  if heads is None:
                      print("::error::无法获取 manifest 月份列表，通配符目标 " + tok + " 暂不可用（稍后重试）")
                      sys.exit(1)
                  for b in branches:
                      ms = months_for(b)
                      if not ms:
                          print("::warning::" + b + " 没有独立发布月份，已跳过（可去掉通配符编最新）")
                          continue
                      for mo in ms:
                          entries.append({
                              "label": b + "-" + mo,
                              "android": b.split("-", 1)[0].replace("android", ""),
                              "kver": kver,
                              "branch": "common-" + b,
                              "release": mo,
                              "pin": b + "-" + mo,
                          })
              else:
                  for b in branches:
                      android = b.split("-", 1)[0].replace("android", "")
                      pin = (b + "-" + month) if month else ""
                      entries.append({
                          "label": b + (("-" + month) if month else ""),
                          "android": android,
                          "kver": kver,
                          "branch": "common-" + b,
                          "release": month,
                          "pin": pin,
                      })

          # 去重（同一分支 + 同一月份只编一次）
          seen = set()
          uniq = []
          for e in entries:
              key = e["branch"] + "|" + e["release"]
              if key not in seen:
                  seen.add(key)
                  uniq.append(e)

          matrix = []
          for e in uniq:
              if heads is not None and e["branch"] not in heads:
                  print("::warning::manifest 分支不存在，已跳过: " + e["branch"])
                  continue
              matrix.append(e)

          if not matrix:
              print("::error::没有有效目标（检查系列 / 月份拼写）")
              sys.exit(1)

          payload = json.dumps(matrix, separators=(",", ":"))
          print("resolved " + str(len(matrix)) + " target(s): " + payload)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + payload + "\n")
          PY

  build:
    needs: prepare
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          df -h /

      - name: Prepare kerneldriver directory
        run: |
          if [ ! -d code ]; then echo "::error::code/ 目录不存在"; exit 1; fi
          mkdir -p kerneldriver
          find ./code -maxdepth 1 \( -name "*.h" -o -name "*.c" -o -name "Makefile" \) -exec cp {} kerneldriver/ \;
          ls -la kerneldriver/

      - name: Detect driver module name
        id: detect
        env:
          DRIVER_INPUT: ${{ github.event.inputs.driver_name }}
        run: |
          if [ -n "${DRIVER_INPUT}" ] && [ "${DRIVER_INPUT}" != "auto" ]; then
            MODULE="${DRIVER_INPUT}"
          else
            cd kerneldriver
            MODULE=$(grep -E '^obj-[my]\s*[:+]?=' Makefile | head -n1 | awk '{print $3}' | sed 's/\.o$/.ko/')
          fi
          if [ -z "${MODULE}" ]; then echo "::error::无法识别模块名，请用 driver_name 输入指定"; exit 1; fi
          echo "module_name=${MODULE}" >> "$GITHUB_OUTPUT"
          echo "module: ${MODULE}"

      - name: Install repo tool
        run: |
          sudo curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python-is-python3

      - name: Set up Android Kernel source
        id: source
        env:
          BASE_BRANCH: ${{ matrix.branch }}
          RELEASE: ${{ matrix.release }}
        run: |
          BRANCH="${BASE_BRANCH}"
          FALLBACK=0
          if [ -n "${RELEASE}" ]; then
            MB="${BASE_BRANCH}-${RELEASE}"
            if git ls-remote --exit-code https://android.googlesource.com/kernel/manifest "refs/heads/${MB}" >/dev/null 2>&1; then
              echo "using month release branch: ${MB}"
              BRANCH="${MB}"
            else
              echo "month branch ${MB} not found, fallback: ${BASE_BRANCH} + respin tag"
              FALLBACK=1
            fi
          fi
          echo "fallback=${FALLBACK}" >> "$GITHUB_OUTPUT"
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b "${BRANCH}"
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Pin kernel source (fallback respin tag)
        if: ${{ matrix.pin != '' && steps.source.outputs.fallback == '1' }}
        env:
          PIN: ${{ matrix.pin }}
        run: |
          cd android-kernel/common
          echo "pin release line: ${PIN}"
          TAG=$(git ls-remote --tags --refs origin "refs/tags/${PIN}_r*" | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -n1)
          OK=0
          if [ -n "$TAG" ]; then
            echo "found respin tag: ${TAG}"
            git fetch --depth=1 origin "refs/tags/${TAG}" && OK=1
          fi
          if [ "$OK" -eq 0 ]; then
            for ref in "refs/heads/${PIN}" "refs/heads/deprecated/${PIN}"; do
              if git fetch --depth=1 origin "$ref"; then echo "fetched: $ref"; OK=1; break; fi
            done
          fi
          if [ "$OK" -eq 0 ]; then
            echo "::error::发布线不存在: ${PIN}（月度分支与 respin 标签都没有，检查月份是否正确）"
            exit 1
          fi
          git checkout -q FETCH_HEAD
          echo "pinned HEAD: $(git log -1 --format='%h %s' | cut -c1-100)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile || true

      - name: Copy kerneldriver
        run: |
          cd android-kernel
          cp -r ../kerneldriver common/drivers

      - name: Modify Makefile
        run: |
          cd android-kernel
          echo "obj-y += kerneldriver/" >> common/drivers/Makefile

      - name: Add module to GKI module list
        env:
          ARCH: ${{ github.event.inputs.target_arch }}
          MODULE_NAME: ${{ steps.detect.outputs.module_name }}
        run: |
          cd android-kernel
          MODULE_PATH="drivers/kerneldriver/${MODULE_NAME}"
          if [ -f common/modules.bzl ]; then
            if grep -q "$MODULE_PATH" common/modules.bzl; then
              echo "modules.bzl: already present"
            else
              sed -i "s#_COMMON_GKI_MODULES_LIST = \[#_COMMON_GKI_MODULES_LIST = [\n    \"$MODULE_PATH\",#" common/modules.bzl
              echo "modules.bzl: added $MODULE_PATH"
            fi
          fi
          LEGACY_LIST="common/android/gki_${ARCH}_modules"
          if [ -f "$LEGACY_LIST" ]; then
            grep -q "$MODULE_PATH" "$LEGACY_LIST" || echo "$MODULE_PATH" >> "$LEGACY_LIST"
            echo "legacy module list: updated"
          fi

      - name: Adjust compiler flags
        run: |
          cd android-kernel
          find . -type f -name "Makefile*" -exec sed -i 's/-Wframe-larger-than=[0-9]*/-Wframe-larger-than=4096/g' {} +
          grep -q "FRAME_WARN" common/Makefile || echo 'KBUILD_CFLAGS += -Wframe-larger-than=4096' >> common/Makefile
          grep -q "Wno-error=unused-function" common/Makefile || echo 'KBUILD_CFLAGS += -Wno-error=unused-function' >> common/Makefile

      - name: Fix missing kprobe symbols (Android13)
        if: matrix.android == '13'
        env:
          ARCH: ${{ github.event.inputs.target_arch }}
        run: |
          cd android-kernel
          for symbol in register_kprobe unregister_kprobe; do
            grep -q "$symbol" "common/android/abi_gki_${ARCH}" || \
            echo "$symbol" >> "common/android/abi_gki_${ARCH}"
          done
          sed -i '/EXPORT_SYMBOL(unregister_kprobe);/a EXPORT_SYMBOL(register_kprobe);' common/kernel/kprobes.c

      - name: Build kernel module
        env:
          ARCH: ${{ github.event.inputs.target_arch }}
          ANDROID: ${{ matrix.android }}
          KV: ${{ matrix.kver }}
        run: |
          cd android-kernel
          if [ "$ANDROID" -le 13 ]; then
            echo "legacy build.sh (Android $ANDROID)"
            BUILD_CONFIG=common/build.config.gki.${ARCH} LTO=thin build/build.sh -j$(nproc)
            OUT="out/android${ANDROID}-${KV}/dist"
          elif [ -f tools/bazel ] && [ -f common/modules.bzl ]; then
            echo "bazel (kleaf) build"
            tools/bazel run //common:kernel_${ARCH}_dist
            OUT="out/kernel_${ARCH}"
          else
            echo "legacy build.sh fallback"
            BUILD_CONFIG=common/build.config.gki.${ARCH} LTO=thin build/build.sh -j$(nproc)
            OUT="out/android${ANDROID}-${KV}/dist"
          fi
          echo "OUTPUT_PATH=${OUT}" >> "$GITHUB_ENV"

      - name: Stage artifacts
        env:
          MODULE_NAME: ${{ steps.detect.outputs.module_name }}
        run: |
          cd android-kernel
          mkdir -p ../upload_artifact
          FOUND=""
          if [ -n "${OUTPUT_PATH:-}" ] && [ -d "${OUTPUT_PATH:-}" ]; then
            FOUND=$(find "$OUTPUT_PATH" -name "$MODULE_NAME" -type f | head -n1)
          fi
          if [ -z "$FOUND" ]; then
            echo "not found in ${OUTPUT_PATH:-<unset>}, searching out/ ..."
            FOUND=$(find out -name "$MODULE_NAME" -type f 2>/dev/null | head -n1)
          fi
          if [ -z "$FOUND" ]; then
            echo "::error::$MODULE_NAME 未找到，构建可能失败。列出部分 .ko:"
            find out -name "*.ko" 2>/dev/null | head -n30
            exit 1
          fi
          echo "Found: $FOUND"
          cp "$FOUND" ../upload_artifact/
          ls -lh ../upload_artifact/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kernel-driver-${{ matrix.label }}-${{ github.event.inputs.target_arch }}
          path: upload_artifact/
          if-no-files-found: error