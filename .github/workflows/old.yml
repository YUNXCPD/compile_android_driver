name: Android Kernel Driver Builder (CodeLinaro)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel) (e.g., 14)'
        required: true
      kernel_version:
        description: 'Kernel Version (e.g., 6.1)'
        required: true
      driver_name:
        description: 'Driver Module Name (e.g., mydriver.ko)'
        required: true
      target_arch:
        description: 'Target Architecture (aarch64, x86_64, etc.)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        
      - name: Prepare kerneldriver directory
        run: |
          mkdir kerneldriver
          mv ./code/*.h ./code/*.c ./code/Makefile kerneldriver/
          
      - name: Set up Android Kernel source
        run: |
          mkdir -p android-kernel && cd android-kernel
          
          # ==========================================
          # 1. 拉取内核源码（CodeLinaro）
          # ==========================================
          KERNEL_TAG="android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}_r6"
          echo ">>> Using CodeLinaro tag: $KERNEL_TAG"
          
          git clone --depth=1 -b "$KERNEL_TAG" \
            https://git.codelinaro.org/clo/la/kernel/common.git common || {
              echo ">>> r6 failed, trying r7..."
              KERNEL_TAG="android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}_r7"
              git clone --depth=1 -b "$KERNEL_TAG" \
                https://git.codelinaro.org/clo/la/kernel/common.git common
            }
          
          # ==========================================
          # 2. 拉取构建脚本（build/）
          # ==========================================
          echo ">>> Cloning kernel/build..."
          git clone --depth=1 https://android.googlesource.com/kernel/build build || {
            echo ">>> Google source failed, trying GitHub mirror..."
            git clone --depth=1 https://github.com/aosp-mirror/kernel_build build || {
              echo ">>> Trying another mirror..."
              git clone --depth=1 https://gitlab.com/aosp-mirror/kernel_build build
            }
          }
          
          # ==========================================
          # 3. 拉取预编译工具链（prebuilts/）
          # ==========================================
          echo ">>> Cloning prebuilts..."
          git clone --depth=1 https://android.googlesource.com/kernel/prebuilts prebuilts || {
            git clone --depth=1 https://github.com/aosp-mirror/kernel_prebuilts prebuilts || true
          }
          
          # ==========================================
          # 4. 调试：确认目录结构
          # ==========================================
          echo ">>> Directory structure:"
          ls -la
          echo ">>> build/ contents:"
          ls -la build/ 2>/dev/null || echo "build/ MISSING!"
          echo ">>> common/ contents:"
          ls -la common/ 2>/dev/null || echo "common/ MISSING!"

      - name: Copy kerneldriver
        run: |
          cd android-kernel
          cp -r ../kerneldriver common/drivers

      - name: Modify Makefile
        run: |
          cd android-kernel
          echo "obj-y += kerneldriver/" >> common/drivers/Makefile

      - name: Prepare module list for legacy builds
        run: |
          cd android-kernel
          echo "drivers/kerneldriver/${{ github.event.inputs.driver_name }}" >> common/android/gki_${{ github.event.inputs.target_arch }}_modules

      - name: Increase stack frame size limit
        run: |
          cd android-kernel
          find . -type f -name "Makefile*" -exec sed -i 's/-Wframe-larger-than=[0-9]*/-Wframe-larger-than=4096/g' {} +
          grep -q "FRAME_WARN" common/Makefile || echo 'KBUILD_CFLAGS += -Wframe-larger-than=4096' >> common/Makefile

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python-is-python3 ccache lzop cpio bzip2 zip

      - name: Fix missing kprobe symbols for Android 13
        if: ${{ github.event.inputs.android_version == 13 }}
        run: |
          cd android-kernel
          for symbol in register_kprobe unregister_kprobe; do
            grep -q "$symbol" common/android/abi_gki_${{ github.event.inputs.target_arch }} || \
            echo "$symbol" >> common/android/abi_gki_${{ github.event.inputs.target_arch }}
          done
          sed -i '/EXPORT_SYMBOL(unregister_kprobe);/a EXPORT_SYMBOL(register_kprobe);' common/kernel/kprobes.c
          
      - name: Build kernel module
        run: |
          cd android-kernel
          
          # 确认 build.sh 存在
          if [ ! -f build/build.sh ]; then
            echo "ERROR: build/build.sh not found!"
            echo "Available files in build/:"
            ls -la build/ 2>/dev/null || echo "build/ directory does not exist"
            exit 1
          fi
          
          if [ ${{ github.event.inputs.android_version }} -le 13 ]; then
            BUILD_CONFIG=common/build.config.gki.${{ github.event.inputs.target_arch }} LTO=thin build/build.sh -j32
            OUTPUT_PATH="out/android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}/dist"
          else
            echo "Using Bazel build system for Android ${{ github.event.inputs.android_version }}"
            tools/bazel run //common:kernel_${{ github.event.inputs.target_arch }}_dist
            OUTPUT_PATH="out/kernel_${{ github.event.inputs.target_arch }}"
          fi
          echo "OUTPUT_PATH=$OUTPUT_PATH" >> $GITHUB_ENV
        continue-on-error: true
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: |
            android-kernel/${{ env.OUTPUT_PATH }}/**/*.ko

