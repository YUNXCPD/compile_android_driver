    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4
        with:
          path: driver

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3 git \
                                  gcc-aarch64-linux-gnu zip

      - name: Clone kernel source via tag (fallback to branch)
        run: |
          # 先尝试 tag，再尝试分支，避免分支名就是 tag 导致的失败
          git init kernel
          cd kernel
          git remote add origin https://android.googlesource.com/kernel/common
          git fetch --depth 1 origin "refs/tags/${{ matrix.tag }}:refs/tags/${{ matrix.tag }}" 2>/dev/null || \
          git fetch --depth 1 origin "refs/heads/${{ matrix.tag }}:refs/heads/${{ matrix.tag }}"
          git checkout FETCH_HEAD
        working-directory: ${{ runner.temp }}

      - name: Apply Android 13 kprobe fixes
        if: matrix.android_ver == '13'
        run: |
          cd ${{ runner.temp }}/kernel
          for symbol in register_kprobe unregister_kprobe; do
            grep -q "$symbol" common/android/abi_gki_aarch64 2>/dev/null || \
            echo "$symbol" >> common/android/abi_gki_aarch64
          done
          sed -i '/EXPORT_SYMBOL(unregister_kprobe);/a EXPORT_SYMBOL(register_kprobe);' kernel/kprobes.c 2>/dev/null || true

      - name: Increase stack frame warning limit
        run: |
          cd ${{ runner.temp }}/kernel
          sed -i 's/-Wframe-larger-than=[0-9]*/-Wframe-larger-than=4096/g' Makefile

      - name: Prepare kernel config and modules
        run: |
          cd ${{ runner.temp }}/kernel
          make ARCH=arm64 gki_defconfig
          echo "CONFIG_LOCALVERSION=\"${{ matrix.localversion }}\"" >> .config
          make ARCH=arm64 olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

      - name: Build driver module
        run: |
          mkdir -p /tmp/driver-src
          cp -r ${{ github.workspace }}/driver/code/* /tmp/driver-src/
          cd ${{ runner.temp }}/kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=/tmp/driver-src modules -j$(nproc)

      - name: Collect and rename .ko
        run: |
          mkdir -p artifacts
          cp /tmp/driver-src/${{ github.event.inputs.driver_name }} artifacts/${{ matrix.label }}.ko
          cd artifacts && zip -r ../artifacts-${{ matrix.label }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: artifacts-${{ matrix.label }}.zip
